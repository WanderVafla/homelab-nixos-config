name: Check Quality & Syntax

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    name: Nix Flake Check
    
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v25
        with:
          nix-path: nixpkgs=channel:nixos-unstable

      # Проверка синтаксиса
      - name: Flake check
        run: nix flake check

      # Построение конфига (без реального применения)
      - name: Build configuration
        run: nix build .#nixosConfigurations.homelab-server.config.system.build.toplevel --dry-run